name: Code Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v4.1.2
    with:
      extensions: 'mbstring, xml, ctype, iconv, intl, bcmath, mongodb, pdo_sqlite'
      # Measured MSI 87.9 % on 2026-11-02 UTC, minus a margin for noise.
      infection-min-msi: 85
      infection-min-covered-msi: 85

  # The Doctrine bridge is suggested, never required: everything must still load and work without it.
  without-doctrine:
    name: Bundle works with no Doctrine installed at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: php tools/check-autoload-isolation.php "$PWD/src" 'MSSTC4PHP\ValueObject\Bundle\'

  # The domain Doctrine packages in composer-ci.json need vo-base ^1.4 and vo-base-doctrine ^1.3, so the standard
  # lowest cell no longer reaches the floors composer.json declares. This cell drops them and proves those floors.
  lowest-without-domain-packages:
    name: PHPUnit, lowest dependencies, no domain Doctrine packages
    runs-on: ubuntu-latest
    env:
      COMPOSER: composer-ci.json
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'mbstring, xml, ctype, iconv, intl, bcmath, mongodb, pdo_sqlite'
          coverage: none
          tools: composer:v2
      - run: >-
          composer remove --dev --no-update --no-interaction
          msstc4php/vo-gs1-doctrine msstc4php/vo-identifiers-doctrine
          msstc4php/vo-documents-doctrine msstc4php/vo-finance-doctrine
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction
      - run: composer show | grep -E "^msstc4php/vo-base(-doctrine)? "
      - run: vendor/bin/phpunit
